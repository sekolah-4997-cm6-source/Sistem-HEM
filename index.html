<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk | Sistem Pengurusan HE@S</title>
  <!-- Tailwind CSS via CDN untuk kemudahan styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- Header Kad (Slate Blue-Grey Theme) -->
    <div class="bg-slate-700 p-6 text-center text-white">
      <div class="w-20 h-20 mx-auto bg-slate-600 rounded-full flex items-center justify-center mb-3 border-2 border-slate-400 shadow-inner">
        <!-- Boleh digantikan dengan <img src="assets/images/logo.png" alt="Logo Sekolah"> -->
        <span class="text-3xl">🏫</span>
      </div>
      <h1 class="text-xl font-bold tracking-wide">SK (FELDA) LAKA SELATAN</h1>
      <p class="text-xs text-slate-300 mt-1 uppercase tracking-wider">Sistem Pengurusan HE@S (One-Stop Centre)</p>
    </div>

    <!-- Borang Log Masuk -->
    <div class="p-8">
      <h2 class="text-lg font-bold text-slate-800 mb-1 text-center">Selamat Datang</h2>
      <p class="text-xs text-slate-500 mb-6 text-center">Sila log masuk untuk mengakses portal pengurusan HEM.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mel Rasmi / ID Guru</label>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="g-12345678@moe-dl.edu.my" 
            class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition"
          >
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kata Laluan</label>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition"
          >
        </div>

        <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="remember-me" class="rounded text-slate-700 focus:ring-slate-500">
            <span>Ingat saya</span>
          </label>
          <a href="#" id="forgot-password" class="text-slate-600 hover:underline font-medium">Lupa Kata Laluan?</a>
        </div>

        <button 
          type="submit" 
          id="btn-login"
          class="w-full py-3 bg-slate-700 hover:bg-slate-800 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition transform active:scale-95 text-sm mt-2"
        >
          Log Masuk Ke Sistem
        </button>

        <!-- Butang Log Masuk Google -->
        <button type="button" id="btn-google-login" class="w-full bg-white border border-slate-300 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-50 transition flex items-center justify-center space-x-2 mt-4 shadow-sm">
             <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google Logo">
              <span>Log Masuk dengan Google (MOE)</span>
      </button>
        
      </form>

      <!-- Paparan Ralat Jika Log Masuk Gagal -->
      <div id="error-message" class="hidden mt-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-xs rounded"></div>
    </div>

    <!-- Kaki Kad (Footer) -->
    <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center text-xs text-slate-400">
      Hak Cipta Terpelihara &copy; Unit HEM SK (FELDA) LAKA SELATAN
    </div>

  </div>

  <!-- Skrip Pengesahan Firebase & Logik Sistem -->
  <script src="js/firebase-config.js" type="module"></script>
  <script src="js/app.js" type="module"></script>
  <script type="module" src="js/auth_guard.js"></script>
</body>
</html>
