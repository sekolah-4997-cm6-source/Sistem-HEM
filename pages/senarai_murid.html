<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senarai Induk Murid | SK (FELDA) LAKA SELATAN</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex">

  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Content Canvas -->
  <main class="flex-1 ml-64 p-6 space-y-6">

    <!-- Topbar Header -->
    <header class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-800">Senarai Induk Murid</h1>
        <p class="text-xs text-slate-500">Pangkalan Data Profil Murid & Semakan Kelayakan Bantuan</p>
      </div>
      <a href="profil_murid.html" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-4 py-2.5 rounded-lg font-semibold shadow-md transition flex items-center space-x-2">
        <i class="fa-solid fa-user-plus"></i>
        <span>Daftar Murid Baru</span>
      </a>
    </header>

    <!-- Bar Penapis & Carian (Filter Bar) -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
      
      <!-- Carian Kata Kunci -->
      <div class="relative w-full md:w-72">
        <input type="text" id="search-keyword" placeholder="Cari Nama / No. MyKid..." 
          class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
      </div>

      <!-- Dropdown Tapisan -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <!-- Tapis Kelas -->
        <select id="filter-kelas" class="p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none">
          <option value="">-- Semua Kelas --</option>
          <option value="1A">1 Alpha</option>
          <option value="2A">2 Alpha</option>
          <option value="3A">3 Alpha</option>
          <option value="4A">4 Alpha</option>
          <option value="5A">5 Alpha</option>
          <option value="6A">6 Alpha</option>
        </select>

        <!-- Tapis Status Bantuan -->
        <select id="filter-bantuan" class="p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none">
          <option value="">-- Semua Kelayakan --</option>
          <option value="RMT">Layak RMT (≤ RM310)</option>
          <option value="BUKAN_RMT">Bukan RMT</option>
        </select>

        <!-- Tapis Status Dokumen -->
        <select id="filter-dokumen" class="p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none">
          <option value="">-- Semua Status Dokumen --</option>
          <option value="LENGKAP">🟢 Lengkap</option>
          <option value="TAK_LENGKAP">🔴 Tidak Lengkap</option>
        </select>
      </div>
    </section>

    <!-- Jadual Induk Murid -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-700 text-white uppercase text-[11px] tracking-wider border-b border-slate-600">
              <th class="p-3">Bil</th>
              <th class="p-3">Nama Murid / MyKid</th>
              <th class="p-3">Kelas</th>
              <th class="p-3">Waris Utama</th>
              <th class="p-3">Gaji Perkapita</th>
              <th class="p-3">Dokumen</th>
              <th class="p-3 text-center">Tindakan</th>
            </tr>
          </thead>
          <tbody id="jadual-murid-body" class="divide-y divide-slate-200 text-slate-700">
            <!-- Data dinamik akan diisi oleh senarai_murid.js -->
            
            <!-- Paparan sementara (Loading) sebelum data Firestore siap ditarik -->
            <tr>
              <td colspan="7" class="p-6 text-center text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Sedang memuatkan data murid...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Container Modal Pop-up Kad Carian Cemas Waris -->
  <div id="modal-carian-cemas" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div id="modal-cemas-content" class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all">
      <!-- Diisi secara dinamik oleh carian_kecemasan.js -->
    </div>
  </div>

  <!-- Skrip Pengesahan & Logik -->
  <script src="../js/auth_guard.js" type="module"></script>
  <script src="../js/components/sidebar.js" type="module"></script>
  <script src="../js/components/carian_kecemasan.js" type="module"></script>
  <script src="../js/senarai_murid.js" type="module"></script>
</body>
</html>
